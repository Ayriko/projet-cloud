name: CI/CD

on:
  push:
    branches: [dev, prod]
    paths-ignore: ["**.md", "docs/**", ".gitignore"]
  pull_request:
    branches: [prod]
    paths-ignore: ["**.md", "docs/**", ".gitignore"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: cloud-ynov-494711
  GCP_REGION: europe-west1
  AR_REPO: demo
  AR_HOST: europe-west1-docker.pkg.dev

jobs:
  # --- Lint + tests des microservices Node (PR et push) ---
  test-services:
    name: Lint & tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, core]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # --- Vérifie que le frontend build (PR et push) ---
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # --- Build + push des 3 images (push main uniquement) ---
  build-push:
    name: Build & push (${{ matrix.service }})
    needs: [test-services, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - service: auth
            context: services/auth
          - service: core
            context: services/core
          - service: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet
      - name: Build & push (tags SHA + latest)
        env:
          IMAGE: ${{ env.AR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.service }}
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ${{ matrix.context }}
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # --- Déploiement Terraform (push main uniquement) ---
  deploy:
    name: Deploy (Terraform)
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform init -input=false
      - name: Terraform apply
        env:
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_database_url: ${{ secrets.TF_DATABASE_URL }}
          TF_VAR_jwt_secret: ${{ secrets.TF_JWT_SECRET }}
          TF_VAR_aws_access_key_id: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_access_key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          TF_VAR_aws_default_region: ${{ vars.AWS_DEFAULT_REGION }}
        run: terraform apply -auto-approve -input=false

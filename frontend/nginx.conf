server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # config.js ne doit pas être mis en cache (généré au runtime)
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # SPA : toutes les routes inconnues renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
